name: Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Attach the APK to the release with this version (e.g. 0.2.0). Leave empty for a test build.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release (test builds from a branch)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext

    - name: Checkout
      uses: actions/checkout@v7

    - name: Check the release version
      if: ${{ inputs.release_version != '' }}
      run: |
        # Releases must use a name every installed updater understands (see game/test/deth_update_test.cpp)
        # and match the version built into the game, or in-game updates break.
        V="${{ inputs.release_version }}"
        SRC=$(sed -n 's/.*DETH_VERSION "\([^"]*\)".*/\1/p' game/Source/deth_version.hpp)
        if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.([0-9]+|b\.[0-9]+)$ ]]; then echo "::error::Release name '$V' must look like 1.0.1 or 1.0.b.1"; exit 1; fi
        if [ "$V" != "$SRC" ]; then echo "::error::Release name '$V' does not match DETH_VERSION '$SRC' in game/Source/deth_version.hpp"; exit 1; fi
        echo "Release $V matches the game version"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install CMake
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"

    - name: Bundle shareware data
      run: |
        mkdir -p game/android-project/app/src/main/bundled-assets/bundled
        wget -q https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -O game/android-project/app/src/main/bundled-assets/bundled/spawn.mpq

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: game/android-project/app/.cxx
        key: ${{ github.workflow }}-v2-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-v2-

    - name: Make the encrypted 7z test fixture
      run: |
        # commons-compress cannot write encrypted 7z, so ArchiveImporterTest gets one from 7-Zip.
        sudo apt-get update -qq && sudo apt-get install -y 7zip
        Z=$(command -v 7zz || command -v 7z)
        mkdir -p "$RUNNER_TEMP/deth-fixture"
        cd "$RUNNER_TEMP/deth-fixture"
        printf 'deth-7z-aes-fixture' > DIABDAT.MPQ
        rm -f fixture.7z
        "$Z" a -p'deth-test' -mhe=on fixture.7z DIABDAT.MPQ
        test -s fixture.7z
        echo "DETH_FIXTURE_7Z_AES=$RUNNER_TEMP/deth-fixture/fixture.7z" >> "$GITHUB_ENV"

    - name: Unit tests (game file import)
      working-directory: game/android-project
      run: |
        set -o pipefail
        ./gradlew testReleaseUnitTest 2>&1 | tee /tmp/gradle.log
        # The encrypted 7z tests skip themselves without the fixture; in CI they must really run.
        grep -q "encryptedSevenZCorrectPassword PASSED" /tmp/gradle.log

    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.DETH_KEYSTORE_BASE64 }}
      run: |
        # A stable key is what lets Android install a new version over the old one.
        # Secrets win when set; otherwise the key shipped in the repo is used (see game/Packaging/android/README.md).
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/deth.keystore
          echo "DETH_KEYSTORE=/tmp/deth.keystore" >> "$GITHUB_ENV"
          echo "DETH_KEY_SOURCE=secret" >> "$GITHUB_ENV"
        else
          echo "DETH_KEYSTORE=$GITHUB_WORKSPACE/game/Packaging/android/deth-release.keystore" >> "$GITHUB_ENV"
          echo "DETH_KEY_SOURCE=repo" >> "$GITHUB_ENV"
        fi

    - name: Build APK
      env:
        DETH_KEYSTORE_PASSWORD: ${{ secrets.DETH_KEYSTORE_PASSWORD }}
        DETH_KEY_ALIAS: ${{ secrets.DETH_KEY_ALIAS }}
        DETH_KEY_PASSWORD: ${{ secrets.DETH_KEY_PASSWORD }}
      working-directory: game/android-project
      run: |
        set -o pipefail
        if [ "$DETH_KEY_SOURCE" = "repo" ]; then
          export DETH_KEYSTORE_PASSWORD=deth-release DETH_KEY_ALIAS=deth DETH_KEY_PASSWORD=deth-release
        fi
        ./gradlew assembleRelease 2>&1 | tee /tmp/gradle.log
        cp app/build/outputs/apk/release/app-release.apk ../../DETH.apk

    - name: Report build errors (commit comment)
      if: ${{ failure() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "Android build failed. Key lines:"
          echo '```'
          grep -nE "error:|error\b|FAILED|What went wrong|Caused by|undefined reference|fatal|CMake Error" /tmp/gradle.log | grep -v "warning" | head -60
          echo '--- tail ---'
          tail -40 /tmp/gradle.log
          echo '```'
        } > /tmp/body.txt
        head -c 60000 /tmp/body.txt > /tmp/body2.txt
        gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat /tmp/body2.txt)" >/dev/null

    - name: Check the APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        AAPT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt
        {
          echo "APK check:"
          echo '```'
          "$AAPT" dump badging DETH.apk 2>&1 | grep -E "^package:|application-label:|native-code|sdkVersion" || echo "aapt not available: $AAPT"
          ls -la DETH.apk
          unzip -l DETH.apk | grep -E "\.so$"
          unzip -l DETH.apk | grep -E "spawn.mpq|assets/txtdata/" | head -4
          echo '```'
        } | tee /tmp/apkinfo.txt
        gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat /tmp/apkinfo.txt)" >/dev/null || true
        set -e
        grep -q "spawn.mpq" /tmp/apkinfo.txt
        grep -q "arm64-v8a" /tmp/apkinfo.txt
        grep -q "arm64-v8a/libzt.so" /tmp/apkinfo.txt # online play

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: DETH.apk
        path: DETH.apk

    - name: Read release notes
      if: ${{ inputs.release_version != '' }}
      id: notes
      run: |
        {
          echo 'body<<DETH_NOTES_EOF'
          cat RELEASE_NOTES.md
          echo 'DETH_NOTES_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Name the file after the version
      if: ${{ inputs.release_version != '' }}
      run: cp DETH.apk DETH${{ inputs.release_version }}.apk

    - name: Publish release
      if: ${{ inputs.release_version != '' }}
      uses: svenstaro/upload-release-action@v2
      with:
        file: DETH${{ inputs.release_version }}.apk
        tag: v${{ inputs.release_version }}
        release_name: DETH v${{ inputs.release_version }}
        body: ${{ steps.notes.outputs.body }}
        overwrite: true
        prerelease: ${{ inputs.prerelease == true }}
