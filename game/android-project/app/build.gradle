def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
	apply plugin: 'com.android.application'
} else {
	apply plugin: 'com.android.library'
}

android {
	ndkVersion '29.0.14206865'
	compileSdk 35
	defaultConfig {
		if (buildAsApplication) {
			applicationId "io.github.ravenor907.deth"
		}
		minSdkVersion 21
		targetSdkVersion 35
		// DETH_VERSION: "1.0.0" (release) or "1.0.b.1" (beta after 1.0.0).
		// versionCode must grow with every update: M*1000000 + m*10000 + p*100 + 50 for a release,
		// +50+N for beta N after M.m.p.
		def dethName = (project.file('../../Source/deth_version.hpp').text =~ /DETH_VERSION "([^"]+)"/)[0][1]
		def code
		def beta = dethName =~ /^([0-9]+)\.([0-9]+)\.b\.([0-9]+)$/
		def release = dethName =~ /^([0-9]+)\.([0-9]+)\.([0-9]+)(?:-[^0-9]*([0-9]+))?$/
		if (beta.matches()) {
			code = beta.group(1).toInteger() * 1000000 + beta.group(2).toInteger() * 10000 + 50 + beta.group(3).toInteger()
		} else if (release.matches()) {
			def base = release.group(1).toInteger() * 1000000 + release.group(2).toInteger() * 10000 + release.group(3).toInteger() * 100
			code = release.group(4) != null ? base + release.group(4).toInteger() : base + 50
		} else {
			throw new GradleException("Unrecognised DETH_VERSION: ${dethName}")
		}
		versionCode code
		versionName dethName
		externalNativeBuild {
			cmake {
				arguments "-DANDROID_STL=c++_static", "-DDISABLE_ZERO_TIER=OFF"
				abiFilters 'arm64-v8a', 'x86_64'
			}
		}
	}
	// Release signing from the environment (CI secrets). Without it, release builds are unsigned.
	def keystorePath = System.getenv("DETH_KEYSTORE")
	if (keystorePath != null && new File(keystorePath).exists()) {
		signingConfigs {
			release {
				storeFile file(keystorePath)
				storePassword System.getenv("DETH_KEYSTORE_PASSWORD")
				keyAlias System.getenv("DETH_KEY_ALIAS")
				keyPassword System.getenv("DETH_KEY_PASSWORD")
			}
		}
	}
	buildTypes {
		debug {
			applicationIdSuffix ".dev"
			// The game is unplayably slow unoptimized; keep debug APKs optimized.
			externalNativeBuild {
				cmake {
					arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
				}
			}
		}
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
			if (keystorePath != null && new File(keystorePath).exists()) {
				signingConfig signingConfigs.release
			}
		}
	}
	namespace 'org.diasurgical.devilutionx'
	// DETH: the archive libraries each ship license files and a Java 9 module-info.
	packaging {
		resources {
			excludes += ['META-INF/versions/*/module-info.class', 'module-info.class',
			             'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
		}
	}
	// DETH: ArchiveImporterTest reads an optional encrypted 7z made by CI (see .github/workflows/Android.yml).
	testOptions {
		unitTests.all {
			def fixture = System.getenv('DETH_FIXTURE_7Z_AES')
			if (fixture != null)
				systemProperty 'deth.fixture.7zAes', fixture
			testLogging {
				events 'passed', 'skipped', 'failed'
				exceptionFormat 'full'
			}
		}
	}
	buildFeatures {
		buildConfig true
	}
	applicationVariants.all { variant ->
		tasks["merge${variant.name.capitalize()}Assets"]
			.dependsOn("externalNativeBuild${variant.name.capitalize()}")
	}
	// DETH: bundled shareware data and the Hellfire mod live outside the generated assets
	// folder, which the native build trims to its own file list.
	sourceSets.main {
		assets.srcDirs += ['src/main/bundled-assets', 'src/main/mod-assets']
	}
	if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
		sourceSets.main {
			jniLibs.srcDir 'libs'
		}
		externalNativeBuild {
			cmake {
				path '../../CMakeLists.txt'
				version "3.31.0+"
				buildStagingDirectory System.env.DevilutionX_Android_StagingDirectory
			}
		}

	}

	if (buildAsLibrary) {
		libraryVariants.all { variant ->
			variant.outputs.each { output ->
				def outputFile = output.outputFile
				if (outputFile != null && outputFile.name.endsWith(".aar")) {
					def fileName = "org.diasurgical.devilutionx.aar"
					output.outputFile = new File(outputFile.parent, fileName)
				}
			}
		}
	}
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'com.android.support.constraint:constraint-layout:2.0.4'
	// DETH: Import Game Files reads .7z, .tar(.gz/.xz), .gz, .xz and password-protected .zip.
	implementation 'org.apache.commons:commons-compress:1.28.0'
	implementation 'commons-io:commons-io:2.20.0'
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'org.tukaani:xz:1.10'
	implementation 'net.lingala.zip4j:zip4j:2.11.5'
	testImplementation 'junit:junit:4.13.2'
}
